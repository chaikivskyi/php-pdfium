name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  MAKEFLAGS: -j2

jobs:
  stub:
    name: arginfo matches the stub
    runs-on: ubuntu-24.04
    container: php:8.4-cli
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate pdfium_arginfo.h and compare
        run: |
          cp pdfium_arginfo.h /tmp/pdfium_arginfo.h
          php /usr/local/lib/php/build/gen_stub.php -f pdfium.stub.php
          diff -u /tmp/pdfium_arginfo.h pdfium_arginfo.h

  test:
    name: test (${{ matrix.os }}, PHP ${{ matrix.php }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: none
          tools: none
        env:
          phpts: nts
      - name: Install libpng and libjpeg (apt)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpng-dev libjpeg-dev pkg-config
      - name: Install libpng and libjpeg (brew)
        if: runner.os == 'macOS'
        run: |
          brew install libpng jpeg-turbo pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix jpeg-turbo)/lib/pkgconfig:$(brew --prefix libpng)/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Fetch PDFium
        run: scripts/fetch-pdfium.sh
      - name: Build and test
        env:
          EXTRA_CFLAGS: -Wall -Wextra -Wno-unused-parameter -Wno-sign-compare -Werror
        run: scripts/test.sh
      - name: Check the library resolves at run time (macOS)
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: |
          otool -L modules/pdfium.so
          otool -l modules/pdfium.so | grep -A2 LC_RPATH
          otool -L modules/pdfium.so | grep libpdfium | grep -E '@rpath/|'"$PWD"'/src/libpdfium'

  test-alpine:
    name: test (alpine ${{ matrix.os }}, PHP ${{ matrix.php }})
    runs-on: ${{ matrix.os }}
    container: php:${{ matrix.php }}-cli-alpine
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Install build tools
        run: |
          # shellcheck disable=SC2086
          apk add --no-cache $PHPIZE_DEPS libpng-dev libjpeg-turbo-dev curl tar git
      - uses: actions/checkout@v4
      - name: Fetch PDFium
        run: scripts/fetch-pdfium.sh
      - name: Build and test
        env:
          EXTRA_CFLAGS: -Wall -Wextra -Wno-unused-parameter -Wno-sign-compare -Werror
        run: scripts/test.sh

  zts:
    name: zts (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: parallel-1.2.15
          tools: none
        env:
          phpts: ts
      - name: Install libpng and libjpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpng-dev libjpeg-dev pkg-config
      - name: Fetch PDFium
        run: scripts/fetch-pdfium.sh
      - name: Build and test
        shell: bash
        env:
          EXTRA_CFLAGS: -Wall -Wextra -Wno-unused-parameter -Wno-sign-compare -Werror
        run: |
          scripts/test.sh tests 2>&1 | tee "$RUNNER_TEMP/tests.log"
          ! grep -E 'SKIP.*\[tests/threads-' "$RUNNER_TEMP/tests.log"

  asan:
    name: asan+ubsan (PHP 8.4)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install libpng and libjpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpng-dev libjpeg-dev pkg-config
      - name: Build PHP with AddressSanitizer and UndefinedBehaviorSanitizer
        run: ci/php-asan.sh "$RUNNER_TEMP/php"
      - name: Fetch PDFium
        run: scripts/fetch-pdfium.sh
      - name: Build with AddressSanitizer and UndefinedBehaviorSanitizer
        env:
          EXTRA_CFLAGS: -Wall -Wextra -Wno-unused-parameter -Wno-sign-compare -Werror
        run: |
          "$RUNNER_TEMP/php/bin/phpize"
          ./configure --with-php-config="$RUNNER_TEMP/php/bin/php-config" --with-pdfium="$PWD/src/libpdfium" \
            CFLAGS='-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer -g' \
            LDFLAGS=-fsanitize=address,undefined
          make
      - name: Test
        run: |
          TEST_PHP_EXECUTABLE="$RUNNER_TEMP/php/bin/php" \
          USE_ZEND_ALLOC=0 USE_TRACKED_ALLOC=1 \
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1 \
          LSAN_OPTIONS="suppressions=$PWD/ci/lsan.supp" \
          scripts/test.sh

  asan-zts:
    name: asan+ubsan-zts (PHP 8.4)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install libpng and libjpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpng-dev libjpeg-dev pkg-config
      - name: Build ZTS PHP and parallel with AddressSanitizer and UndefinedBehaviorSanitizer
        run: ci/php-asan.sh "$RUNNER_TEMP/php" zts
      - name: Fetch PDFium
        run: scripts/fetch-pdfium.sh
      - name: Build with AddressSanitizer and UndefinedBehaviorSanitizer
        env:
          EXTRA_CFLAGS: -Wall -Wextra -Wno-unused-parameter -Wno-sign-compare -Werror
        run: |
          "$RUNNER_TEMP/php/bin/phpize"
          ./configure --with-php-config="$RUNNER_TEMP/php/bin/php-config" --with-pdfium="$PWD/src/libpdfium" \
            CFLAGS='-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer -g' \
            LDFLAGS=-fsanitize=address,undefined
          make
      - name: Test
        shell: bash
        run: |
          TEST_PHP_EXECUTABLE="$RUNNER_TEMP/php/bin/php" \
          USE_ZEND_ALLOC=0 USE_TRACKED_ALLOC=1 TEST_TIMEOUT=600 \
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1 \
          LSAN_OPTIONS="suppressions=$PWD/ci/lsan.supp" \
          scripts/test.sh tests 2>&1 | tee "$RUNNER_TEMP/tests.log"
          ! grep -E 'SKIP.*\[tests/threads-' "$RUNNER_TEMP/tests.log"

  valgrind:
    name: valgrind (PHP 8.4)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: none
          tools: none
        env:
          phpts: nts
      - name: Install libpng, libjpeg and valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpng-dev libjpeg-dev pkg-config valgrind
      - name: Fetch PDFium
        run: scripts/fetch-pdfium.sh
      - name: Build and test under Valgrind
        env:
          EXTRA_CFLAGS: -Wall -Wextra -Wno-unused-parameter -Wno-sign-compare -Werror
        run: |
          # run-tests passes no --leak-check of its own. The tracked allocator frees the Zend heap at request
          # end, as the real one does, so what is left is native memory: PDFium's, libpng's and libjpeg's.
          USE_ZEND_ALLOC=0 USE_TRACKED_ALLOC=1 \
          VALGRIND_OPTS="--leak-check=full --suppressions=$PWD/ci/valgrind.supp" \
          scripts/test.sh -m -d report_memleaks=0 tests

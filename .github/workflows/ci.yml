name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

env:
  MAKEFLAGS: -j2
  EXTRA_CFLAGS: -Wall -Wextra -Wno-unused-parameter -Wno-sign-compare -Werror
  SANITIZE_CFLAGS: -fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer -g

jobs:
  images:
    uses: ./.github/workflows/images.yml
    permissions:
      contents: read
      packages: write

  stub:
    name: arginfo matches the stub
    runs-on: ubuntu-24.04
    container: php:8.4-cli
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate pdfium_arginfo.h and compare
        run: |
          cp pdfium_arginfo.h /tmp/pdfium_arginfo.h
          php /usr/local/lib/php/build/gen_stub.php -f pdfium.stub.php
          diff -u /tmp/pdfium_arginfo.h pdfium_arginfo.h

  test:
    name: test (${{ matrix.os }}, PHP ${{ matrix.php }})
    runs-on: ${{ matrix.os }}
    needs: images
    container:
      image: ghcr.io/${{ github.repository_owner }}/pdfium-ci:${{ matrix.php }}-nts-${{ needs.images.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: scripts/test.sh

  test-alpine:
    name: test (alpine ${{ matrix.os }}, PHP ${{ matrix.php }})
    runs-on: ${{ matrix.os }}
    needs: images
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/pdfium-ci:${{ matrix.php }}-alpine-${{ needs.images.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and test
        run: docker run --rm -v "$PWD:/src" -w /src -e MAKEFLAGS -e EXTRA_CFLAGS "$IMAGE" scripts/test.sh

  install:
    name: install without --with-pdfium (${{ matrix.image }})
    runs-on: ubuntu-24.04
    needs: images
    container:
      image: ghcr.io/${{ github.repository_owner }}/pdfium-ci:8.4-${{ matrix.image }}-${{ needs.images.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        image: [nts, alpine]
    steps:
      - uses: actions/checkout@v4
      - name: Build and install
        run: |
          phpize
          ./configure
          make
          make install
      - name: Load without the build tree
        run: |
          rm -rf src/libpdfium modules .libs
          php -n -d extension=pdfium -r 'exit(Pdfium\Document::fromFile("tests/fixtures/text-3pages.pdf")->pageCount() === 3 ? 0 : 1);'

  zts:
    name: zts (${{ matrix.image }} ${{ matrix.os }}, PHP ${{ matrix.php }})
    runs-on: ${{ matrix.os }}
    needs: images
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/pdfium-ci:${{ matrix.php }}-${{ matrix.image }}-${{ needs.images.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        image: [zts, alpine-zts]
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and test
        run: |
          status=0
          docker run --rm -v "$PWD:/src" -w /src -e MAKEFLAGS -e EXTRA_CFLAGS "$IMAGE" scripts/test.sh tests >/tmp/tests.log 2>&1 || status=$?
          cat /tmp/tests.log
          test "$status" -eq 0
          ! grep -E 'SKIP.*\[tests/threads-' /tmp/tests.log

  asan:
    name: asan+ubsan (PHP 8.4)
    runs-on: ubuntu-24.04
    needs: images
    container:
      image: ghcr.io/${{ github.repository_owner }}/pdfium-ci:asan-nts-${{ needs.images.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          CFLAGS="$SANITIZE_CFLAGS" LDFLAGS=-fsanitize=address,undefined \
          USE_ZEND_ALLOC=0 USE_TRACKED_ALLOC=1 \
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1 \
          LSAN_OPTIONS="suppressions=$PWD/ci/lsan.supp" \
          scripts/test.sh

  asan-zts:
    name: asan+ubsan-zts (PHP 8.4)
    runs-on: ubuntu-24.04
    needs: images
    container:
      image: ghcr.io/${{ github.repository_owner }}/pdfium-ci:asan-zts-${{ needs.images.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: bash
        run: |
          CFLAGS="$SANITIZE_CFLAGS" LDFLAGS=-fsanitize=address,undefined \
          USE_ZEND_ALLOC=0 USE_TRACKED_ALLOC=1 TEST_TIMEOUT=600 \
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1 \
          LSAN_OPTIONS="suppressions=$PWD/ci/lsan.supp" \
          scripts/test.sh tests 2>&1 | tee /tmp/tests.log
          ! grep -E 'SKIP.*\[tests/threads-' /tmp/tests.log

  valgrind:
    name: valgrind (PHP 8.4)
    runs-on: ubuntu-24.04
    needs: images
    container:
      image: ghcr.io/${{ github.repository_owner }}/pdfium-ci:8.4-nts-${{ needs.images.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and test under Valgrind
        run: |
          # run-tests passes no --leak-check of its own. The tracked allocator frees the Zend heap at request
          # end, as the real one does, so what is left is native memory: PDFium's, libpng's and libjpeg's.
          USE_ZEND_ALLOC=0 USE_TRACKED_ALLOC=1 \
          VALGRIND_OPTS="--leak-check=full --suppressions=$PWD/ci/valgrind.supp" \
          scripts/test.sh -m -d report_memleaks=0 tests

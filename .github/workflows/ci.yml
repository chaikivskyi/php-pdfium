name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

env:
  MAKEFLAGS: -j2
  EXTRA_CFLAGS: -Wall -Wextra -Wno-unused-parameter -Wno-sign-compare -Werror
  SANITIZE_CFLAGS: -fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer -g

jobs:
  stub:
    name: arginfo matches the stub
    runs-on: ubuntu-24.04
    container: php:8.4-cli
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate pdfium_arginfo.h and compare
        run: |
          cp pdfium_arginfo.h /tmp/pdfium_arginfo.h
          php /usr/local/lib/php/build/gen_stub.php -f pdfium.stub.php
          diff -u /tmp/pdfium_arginfo.h pdfium_arginfo.h

  test:
    name: test (${{ matrix.os }}, PHP ${{ matrix.php }})
    runs-on: ${{ matrix.os }}
    container:
      image: ghcr.io/${{ github.repository_owner }}/pdfium-ci:${{ matrix.php }}-nts
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - name: Fetch PDFium
        run: scripts/fetch-pdfium.sh
      - name: Build and test
        run: scripts/test.sh

  test-macos:
    name: test (macos-14, PHP ${{ matrix.php }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: none
          tools: none
        env:
          phpts: nts
      - name: Install libpng and libjpeg
        run: |
          brew install libpng jpeg-turbo pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix jpeg-turbo)/lib/pkgconfig:$(brew --prefix libpng)/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Fetch PDFium
        run: scripts/fetch-pdfium.sh
      - name: Build and test
        run: scripts/test.sh
      - name: Check the library resolves at run time
        if: ${{ !cancelled() }}
        run: |
          otool -L modules/pdfium.so
          otool -l modules/pdfium.so | grep -A2 LC_RPATH
          otool -L modules/pdfium.so | grep libpdfium | grep -E '@rpath/|'"$PWD"'/src/libpdfium'

  test-alpine:
    name: test (alpine ${{ matrix.os }}, PHP ${{ matrix.php }})
    runs-on: ${{ matrix.os }}
    container:
      image: ghcr.io/${{ github.repository_owner }}/pdfium-ci:${{ matrix.php }}-alpine
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - name: Fetch PDFium
        run: scripts/fetch-pdfium.sh
      - name: Build and test
        run: scripts/test.sh

  zts:
    name: zts (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/${{ github.repository_owner }}/pdfium-ci:${{ matrix.php }}-zts
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - name: Fetch PDFium
        run: scripts/fetch-pdfium.sh
      - name: Build and test
        shell: bash
        run: |
          scripts/test.sh tests 2>&1 | tee /tmp/tests.log
          ! grep -E 'SKIP.*\[tests/threads-' /tmp/tests.log

  asan:
    name: asan+ubsan (PHP 8.4)
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/${{ github.repository_owner }}/pdfium-ci:asan-nts
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch PDFium
        run: scripts/fetch-pdfium.sh
      - name: Build and test
        run: |
          CFLAGS="$SANITIZE_CFLAGS" LDFLAGS=-fsanitize=address,undefined \
          USE_ZEND_ALLOC=0 USE_TRACKED_ALLOC=1 \
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1 \
          LSAN_OPTIONS="suppressions=$PWD/ci/lsan.supp" \
          scripts/test.sh

  asan-zts:
    name: asan+ubsan-zts (PHP 8.4)
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/${{ github.repository_owner }}/pdfium-ci:asan-zts
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch PDFium
        run: scripts/fetch-pdfium.sh
      - name: Build and test
        shell: bash
        run: |
          CFLAGS="$SANITIZE_CFLAGS" LDFLAGS=-fsanitize=address,undefined \
          USE_ZEND_ALLOC=0 USE_TRACKED_ALLOC=1 TEST_TIMEOUT=600 \
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1 \
          LSAN_OPTIONS="suppressions=$PWD/ci/lsan.supp" \
          scripts/test.sh tests 2>&1 | tee /tmp/tests.log
          ! grep -E 'SKIP.*\[tests/threads-' /tmp/tests.log

  valgrind:
    name: valgrind (PHP 8.4)
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/${{ github.repository_owner }}/pdfium-ci:8.4-nts
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch PDFium
        run: scripts/fetch-pdfium.sh
      - name: Build and test under Valgrind
        run: |
          # run-tests passes no --leak-check of its own. The tracked allocator frees the Zend heap at request
          # end, as the real one does, so what is left is native memory: PDFium's, libpng's and libjpeg's.
          USE_ZEND_ALLOC=0 USE_TRACKED_ALLOC=1 \
          VALGRIND_OPTS="--leak-check=full --suppressions=$PWD/ci/valgrind.supp" \
          scripts/test.sh -m -d report_memleaks=0 tests

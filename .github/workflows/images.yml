name: CI images

on:
  workflow_call:
    outputs:
      tag:
        value: ${{ jobs.plan.outputs.tag }}
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  plan:
    name: find missing images
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      missing: ${{ steps.plan.outputs.missing }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: plan
        env:
          REPO: ghcr.io/${{ github.repository_owner }}/pdfium-ci
          REBUILD: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          images=$(
            for php in 8.2 8.3 8.4 8.5; do
              jq -nc --arg n "$php-nts" --arg b "php:$php-cli-bookworm" \
                '{name: $n, file: "php", args: "BASE=\($b)", platforms: "linux/amd64,linux/arm64"}'
              jq -nc --arg n "$php-zts" --arg b "php:$php-zts-bookworm" \
                '{name: $n, file: "php", args: "BASE=\($b)\nPARALLEL_VERSION=1.2.15", platforms: "linux/amd64,linux/arm64"}'
              jq -nc --arg n "$php-alpine" --arg b "php:$php-cli-alpine" \
                '{name: $n, file: "php", args: "BASE=\($b)", platforms: "linux/amd64,linux/arm64"}'
              jq -nc --arg n "$php-alpine-zts" --arg b "php:$php-zts-alpine" \
                '{name: $n, file: "php", args: "BASE=\($b)\nPARALLEL_VERSION=1.2.15", platforms: "linux/amd64,linux/arm64"}'
            done
            jq -nc '{name: "asan-nts", file: "asan", args: "", platforms: "linux/amd64"}'
            jq -nc '{name: "asan-zts", file: "asan", args: "ZTS=zts", platforms: "linux/amd64"}'
          )
          tag=$({ cat ci/docker/*.Dockerfile ci/php-asan.sh; echo "$images"; } | sha256sum | cut -c1-12)
          missing=$(
            echo "$images" | while read -r image; do
              name=$(echo "$image" | jq -r .name)
              if [ "$REBUILD" = true ] || ! docker manifest inspect "$REPO:$name-$tag" >/dev/null 2>&1; then
                echo "$image"
              fi
            done | jq -sc .
          )
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
          echo "tag $tag, building: $(echo "$missing" | jq -r 'map(.name) | join(" ")')"

  build:
    name: build ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.missing != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.missing) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/docker/${{ matrix.file }}.Dockerfile
          platforms: ${{ matrix.platforms }}
          build-args: ${{ matrix.args }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pdfium-ci:${{ matrix.name }}-${{ needs.plan.outputs.tag }}
